server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 5 photos de visage en base64 peuvent dépasser la limite par défaut (1 Mo)
    client_max_body_size 25m;

    # /api/auth/login  ->  http://backend:8000/auth/login  (le préfixe /api est retiré)
        location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://backend:8000/ /api/;
        proxy_read_timeout 300s;
    }

    # Application React : toute autre URL renvoie index.html
    location / {
        try_files $uri /index.html;
    }
}
